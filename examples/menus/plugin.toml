# A plugin's additions: a button for the Edit menu that opens a menu of its own,
# one more entry for Paste Special, and a setting. The program shows the plugin's
# buttons only while the plugin is switched on (by their ids: the demo's
# "Share plugin on" switch).

[menu.edit.settings.layout]
radius = 130.0   # later files win, key by key

[[menu.edit.button]]
dir = "S"
label = "Share"
id = "plugin.share"
opens = "share"

[[menu.paste_special.button]]
dir = "SE"
label = "As Image"
id = "plugin.paste_image"

[[menu.share.button]]
dir = "N"
back = true

[[menu.share.button]]
dir = "SE"
label = "Email"
id = "plugin.share.email"

[[menu.share.button]]
dir = "S"
label = "Chat"
id = "plugin.share.chat"

[[menu.share.button]]
dir = "SW"
label = "Link"
id = "plugin.share.link"

# The demo does not handle this action: it shows how such a button looks
# (disabled, marked in the tree, drawn in the error colour by the demo).
[[menu.share.button]]
dir = "W"
label = "Print"
id = "plugin.share.print"
