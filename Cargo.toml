[package]
name = "egui_pie_menu"
version = "0.36.1"
edition = "2024"
rust-version = "1.88"
description = "A radial (pie) menu widget for egui, inspired by Blender's pie menus"
license = "MIT"
repository = "https://github.com/Deuracell/egui_pie_menu"
readme = "README.md"
keywords = ["egui", "gui", "menu", "pie-menu", "radial"]
categories = ["gui"]

[features]
# Serialize / deserialize the settings types (`PieMenuSettings` and everything in it).
serde = ["dep:serde", "egui/serde"]

[dependencies]
egui = "0.36.2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
