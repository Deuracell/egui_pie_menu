[package]
name = "egui_pie_menu"
version = "0.36.2"
edition = "2024"
description = "A radial (pie) menu widget for egui, inspired by Blender's pie menus"
license = "MIT"
repository = "https://github.com/Deuracell/egui_pie_menu"
readme = "README.md"
keywords = ["egui", "gui", "menu", "pie-menu", "radial"]
categories = ["gui"]

[dependencies]
egui = "0.36.2"
serde = { version = "1", optional = true, features = ["derive"] }
toml = { version = "1", optional = true, features = ["preserve_order"] }

[features]
serde = ["dep:serde", "egui/serde"]
toml = ["serde", "dep:toml"]

[dev-dependencies]
# The demo and the tests use the TOML menus.
egui_pie_menu = { path = ".", features = ["toml"] }
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
